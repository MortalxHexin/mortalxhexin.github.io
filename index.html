<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="./">感動的幸福<span>gandongdexingfu</span></a>
    <nav class="top"><a href="#works">作品</a><a href="#about">關於</a><a href="https://github.com/gandongdexingfu/lemo-opuscar/tree/main/mine">做法</a></nav>
  </header>

  <section class="intro">
    <h1>每一幀，<br>都由代碼畫成。</h1>
    <p>照片交給 AI 生成，其餘的線條、動作、鏡頭和聲音，都是一行一行寫出來的。把游標移到畫面或下方的指紋上，就能在片中前後移動。
      <span class="en">Short films drawn frame by frame in code. Move along a film's fingerprint to travel through it.</span></p>
  </section>

  <div class="filters" id="filters" role="toolbar" aria-label="按風格篩選"></div>
  <main class="works" id="works"></main>

  <footer id="about">
    <span>照片由 AI 生成；畫面、音效與配樂由代碼生成。配樂取樣來自 CC0 樂器庫。</span>
    <span>© 2026 gandongdexingfu</span>
  </footer>
</div>

<script src="assets/site.js"></script>
<script>
SITE.load('').then(([WORKS, FP]) => {
  const host = document.getElementById('works');
  // 風格篩選：從作品資料自動長出按鈕
  const bar = document.getElementById('filters'), styles = [...new Set(WORKS.map(w => w.style))];
  const mk = (label, key, n) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.key = key; b.setAttribute('aria-pressed', key === '*'); b.innerHTML = `${label}<span>${n}</span>`; bar.appendChild(b); };
  mk('全部', '*', WORKS.length); styles.forEach(st => mk(st, st, WORKS.filter(w => w.style === st).length));
  const apply = key => { bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key)); host.querySelectorAll('.plate').forEach(p => { p.hidden = key !== '*' && p.dataset.style !== key; }); try { history.replaceState(null, '', key === '*' ? location.pathname : '?style=' + encodeURIComponent(key)); } catch (e) {} };
  bar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) apply(b.dataset.key); });
  WORKS.forEach(w => {
    const el = document.createElement('article'); el.className = 'plate'; el.dataset.style = w.style;
    el.innerHTML = SITE.plateHTML(w, '') + `<dl class="spec">${w.spec.map(([a, b]) => `<dt>${SITE.esc(a)}</dt><dd>${SITE.esc(b)}</dd>`).join('')}</dl>`;
    host.appendChild(el); SITE.mount(el, w, FP[w.id]);
  });
  const st0 = new URLSearchParams(location.search).get('style'); if (st0 && styles.includes(st0)) apply(st0);
});
</script>
</body>
</html>
